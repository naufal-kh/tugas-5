name: Build EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile C++
        run: g++ genap_ganjil.cpp -o genap_ganjil.exe

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: genap-ganjil-exe
          path: genap_ganjil.exe
